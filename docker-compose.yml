services:

  postgres:
    image: postgres:15-alpine
    container_name: platform-capstone-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ecommerce_user
      POSTGRES_PASSWORD: ecommerce_pass
      POSTGRES_DB: ecommerce_db

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce_user -d ecommerce_db"]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - platform-net


  backend:
    image: platform-capstone-backend:dev
    container_name: platform-capstone-backend
    restart: unless-stopped

    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ecommerce_user
      DB_PASS: ecommerce_pass
      DB_NAME: ecommerce_db

    ports:
      - "5000:5000"

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "-O",
          "-",
          "http://127.0.0.1:5000/health"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - platform-net


  frontend:
    image: platform-capstone-frontend:dev
    container_name: platform-capstone-frontend
    restart: unless-stopped

    ports:
      - "8080:80"

    depends_on:
      backend:
        condition: service_healthy

    networks:
      - platform-net


volumes:
  postgres-data:


networks:
  platform-net:
    driver: bridge
